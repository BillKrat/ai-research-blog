prefixes:
  base: https://blogresearch.net/id/
  xsd: http://www.w3.org/2001/XMLSchema#
mappings:
  organizations_map:
    sources:
    - query: SELECT * FROM "organizations"
    s: base:organizations/id=$(id)
    po:
    - [a, base:organizations~iri]
    - p: base:organizations#id
      o:
      - value: $(id)
        datatype: xsd:string
    - p: base:organizations#tenant_id
      o:
      - value: $(tenant_id)
        datatype: xsd:string
    - p: base:organizations#name
      o:
      - value: $(name)
        datatype: xsd:string
    - p: base:organizations#description
      o:
      - value: $(description)
        datatype: xsd:string
    - p: base:organizations#created_at
      o:
      - value: $(created_at)
        datatype: xsd:string
    - p: base:organizations#ref-tenant_id
      o:
      - mapping: tenants_map
        condition:
          function: equal
          parameters:
          - [str1, $(tenant_id), s]
          - [str2, $(id), o]
  permissions_map:
    sources:
    - query: SELECT * FROM "permissions"
    s: base:permissions/id=$(id)
