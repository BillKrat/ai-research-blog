      o:
      - value: $(permission_id)
        datatype: xsd:string
    - p: base:role_permissions#ref-role_id
      o:
      - mapping: roles_map
        condition:
          function: equal
          parameters:
          - [str1, $(role_id), s]
          - [str2, $(id), o]
    - p: base:role_permissions#ref-permission_id
      o:
      - mapping: permissions_map
        condition:
          function: equal
