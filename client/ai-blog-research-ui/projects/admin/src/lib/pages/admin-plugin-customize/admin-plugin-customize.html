<section class="plugin-customize">
  <adv-page-header title="Customize plug-in" />
  <p class="plugin-customize__back"><a routerLink="/admin/plugins">Back to Plugins</a></p>

  @for (message of errors(); track message) {
    <p class="plugin-customize__error" role="alert">{{ message }}</p>
  }

  @if (!isLoading() && definitions().length > 0) {
    <form class="plugin-customize__form" (submit)="save($event)">
      <adv-setting-fields [definitions]="definitions()" [values]="values()" [secretsSet]="secretsSet()" [clearing]="clearing()" (changed)="set($event.name, $event.value)" (cleared)="clearSecret($event)" />

      <div class="plugin-customize__actions">
        <button type="submit" [disabled]="isSaving()">Save</button>
        @if (saved()) {
          <span class="plugin-customize__saved" role="status">Saved.</span>
        }
      </div>
    </form>
  }
</section>
