<section class="login">
  <adv-page-header title="Sign in" />

  @if (expired) {
    <p class="login__notice" role="status">Your session has expired. Sign in again to carry on where you were.</p>
  }

  <form class="login__form" [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field appearance="outline">
      <mat-label>Username</mat-label>
      <input matInput formControlName="userName" autocomplete="username" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input matInput type="password" formControlName="password" autocomplete="current-password" />
    </mat-form-field>

    @if (errorMessage(); as message) {
      <p class="login__error" role="alert">{{ message }}</p>
    }

    <button mat-flat-button type="submit" [disabled]="form.invalid || isSubmitting()" [matTooltip]="'signIn' | label" [attr.aria-label]="'signIn' | label">
      @if (isSubmitting()) {
        <mat-spinner diameter="20" />
      } @else {
        <span><mat-icon>login</mat-icon> {{ 'signIn' | label }}</span>
      }
    </button>
  </form>
</section>
