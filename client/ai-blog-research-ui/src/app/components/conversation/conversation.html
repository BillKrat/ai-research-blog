<section class="conversation" aria-label="Conversation">
  <h3>Conversation</h3>

  @for (message of errors(); track message) {
    <p class="conversation__error" role="alert">{{ message }}</p>
  }

  @for (entry of entries(); track entry.id) {
    <article class="conversation__entry" [class.conversation__entry--decision]="entry.kind === 'Decision'">
      <header>
        <strong>{{ entry.author }}</strong>
        <span class="conversation__when">{{ entry.created | date: 'medium' }}</span>
        @if (entry.kind === 'Decision') {
          <span class="conversation__decision">Decision</span>
        }
      </header>
      <app-markdown-content [markdown]="entry.body" />
    </article>
  } @empty {
    <p class="conversation__none">Nothing said yet.</p>
  }

  <form class="conversation__add" (ngSubmit)="send()">
    <textarea name="text" rows="3" [(ngModel)]="text" aria-label="Add to the conversation" placeholder="Answer, ask, or record a decision (Markdown)"></textarea>
    <div class="conversation__actions">
      <mat-checkbox name="asDecision" [(ngModel)]="asDecision">Record as a decision</mat-checkbox>
      <button mat-icon-button color="primary" type="submit" [disabled]="sending() || !text.trim()" [matTooltip]="'send' | label" [attr.aria-label]="'send' | label">
        <mat-icon>send</mat-icon>
      </button>
    </div>
  </form>
</section>
