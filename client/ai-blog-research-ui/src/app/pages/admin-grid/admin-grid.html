<section class="admin-grid">
  <div class="admin-grid__head">
    <h2>{{ title() }}</h2>
    @if (canCreate) {
      <button mat-stroked-button type="button" class="admin-grid__new" (click)="create()">
        <mat-icon>add</mat-icon>
        New
      </button>
    }
  </div>

  @for (message of errors(); track message) {
    <p class="admin-grid__error" role="alert">{{ message }}</p>
  }

  @if (isLoading() && !model()) {
    <p>Loading...</p>
  } @else if (model(); as grid) {
    @if (grid.rows.length === 0) {
      <p>Nothing here yet.</p>
    } @else {
      <app-entity-grid [model]="grid" [toggleFields]="['IsPublished']" (request)="onRequest($event)" />
    }
  }
</section>
