<section class="profile">
  <h2>Profile</h2>

  @if (isLoading()) {
    <p>Loading profile...</p>
  } @else if (model()) {
    <app-entity-form [model]="model()!" (save)="onSave($event)">
      @switch (saveState()) {
        @case ('saved') {
          <p class="profile__status profile__status--success" role="status">Saved.</p>
        }
        @case ('error') {
          <p class="profile__status profile__status--error" role="alert">Couldn't save your profile. Try again.</p>
        }
      }

      <button mat-flat-button type="submit" [disabled]="saveState() === 'saving'">
        {{ saveState() === 'saving' ? 'Saving...' : 'Save' }}
      </button>
    </app-entity-form>

    <div class="profile__danger-zone">
      @if (deleteState() === 'error') {
        <p class="profile__status profile__status--error" role="alert">You can't delete your own account.</p>
      }

      <button mat-stroked-button color="warn" type="button" (click)="deleteMyAccount()" [disabled]="deleteState() === 'deleting'">
        {{ deleteState() === 'deleting' ? 'Deleting...' : 'Delete my account' }}
      </button>
    </div>
  }
</section>
