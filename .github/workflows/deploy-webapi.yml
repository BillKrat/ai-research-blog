name: Deploy WebApi to api.global-webnet.com

on:
  push:
    branches: [main]
    paths:
      - "src/AiBlogResearch.WebApi/**"
      - "AiBlogResearch.ServiceDefaults/**"
      - ".github/workflows/deploy-webapi.yml"
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish (Release)
        run: dotnet publish src/AiBlogResearch.WebApi/AiBlogResearch.WebApi.csproj -c Release -o publish

      - name: Put API offline for deployment
        run: |
          printf '<html><body><h1>Maintenance</h1><p>Deployment in progress. Please retry shortly.</p></body></html>' > /tmp/app_offline.htm
          curl --ftp-method nocwd --ftp-pasv -T /tmp/app_offline.htm \
            --user "${{ secrets.SMARTERASP_API_FTP_USERNAME }}:${{ secrets.SMARTERASP_API_FTP_PASSWORD }}" \
            "ftp://${{ secrets.SMARTERASP_FTP_SERVER }}/app_offline.htm"
          sleep 5

      - name: Deploy to SmarterASP.NET via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SMARTERASP_FTP_SERVER }}
          username: ${{ secrets.SMARTERASP_API_FTP_USERNAME }}
          password: ${{ secrets.SMARTERASP_API_FTP_PASSWORD }}
          protocol: ftp
          local-dir: publish/
          server-dir: /

      - name: Bring API back online
        if: success()
        run: |
          curl --ftp-method nocwd --ftp-pasv --quote "DELE app_offline.htm" \
            --user "${{ secrets.SMARTERASP_API_FTP_USERNAME }}:${{ secrets.SMARTERASP_API_FTP_PASSWORD }}" \
            "ftp://${{ secrets.SMARTERASP_FTP_SERVER }}/"
