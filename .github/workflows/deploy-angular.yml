name: Deploy Angular to global-webnet.com

on:
  push:
    branches: [main]
    paths:
      - "client/ai-blog-research-ui/**"
      - ".github/workflows/deploy-angular.yml"
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/ai-blog-research-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: client/ai-blog-research-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      # An installation on another domain sets the repository variable SITE_DOMAIN; without it the file keeps this project's own address.
      - name: Point the client at this installation's API
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          if [ -n "$SITE_DOMAIN" ]; then
            case "$SITE_DOMAIN" in *[!a-zA-Z0-9.-]*) echo "::error::SITE_DOMAIN must be a bare domain name"; exit 1;; esac
            sed -i "s|apiUrl: '[^']*'|apiUrl: 'https://api.${SITE_DOMAIN}'|" src/environments/environment.production.ts
            grep apiUrl src/environments/environment.production.ts
          fi

      - name: Build (production)
        run: npm run build

      - name: Deploy to SmarterASP.NET via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SMARTERASP_FTP_SERVER }}
          username: ${{ secrets.SMARTERASP_FTP_USERNAME }}
          password: ${{ secrets.SMARTERASP_FTP_PASSWORD }}
          protocol: ftp
          local-dir: client/ai-blog-research-ui/dist/ai-blog-research-ui/browser/
          server-dir: /
