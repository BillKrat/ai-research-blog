name: Deploy Angular to global-webnet.com

on:
  push:
    branches: [main]
    paths:
      - "client/ai-blog-research-ui/**"
      - ".github/workflows/deploy-angular.yml"
  workflow_dispatch: {}

jobs:
  test:
    # single-site mode (repository variable DEPLOY_MODE=single) deploys through deploy-single.yml instead
    if: ${{ vars.DEPLOY_MODE != 'single' }}
    uses: ./.github/workflows/test.yml
    with:
      suite: client

  build-and-deploy:
    if: ${{ vars.DEPLOY_MODE != 'single' }}
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/ai-blog-research-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: client/ai-blog-research-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      # An installation on another domain sets the repository variable SITE_DOMAIN (the API is then https://api.<domain>); an installation on temporary
      # addresses sets API_URL to the API site's own temporary address instead (it wins). Without either the file keeps this project's own address.
      - name: Point the client at this installation's API
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          API_URL: ${{ vars.API_URL }}
        run: bash ../../.github/scripts/set-api-url.sh src/environments/environment.production.ts

      - name: Build (production)
        run: npm run build

      - name: Deploy to SmarterASP.NET via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SMARTERASP_FTP_SERVER }}
          username: ${{ secrets.SMARTERASP_FTP_USERNAME }}
          password: ${{ secrets.SMARTERASP_FTP_PASSWORD }}
          protocol: ftp
          local-dir: client/ai-blog-research-ui/dist/ai-blog-research-ui/browser/
          server-dir: /
